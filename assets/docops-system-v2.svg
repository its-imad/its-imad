<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">DocOps system map</title>
  <desc id="desc">A clean system map showing how product changes become documentation signals, operational workflows, trusted knowledge, and activation for users and agents.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --line: #cbd5e1;
      --panel: #f8fafc;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --violet: #7c3aed;
      --violet-soft: #ede9fe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --orange: #f97316;
      --orange-soft: #ffedd5;
      --rose: #dc2626;
      --rose-soft: #fee2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --ink: #e5e7eb;
        --muted: #94a3b8;
        --line: #334155;
        --panel: #111827;
        --blue-soft: #102a5c;
        --violet-soft: #2e205f;
        --green-soft: #12361f;
        --orange-soft: #43260d;
        --rose-soft: #43171a;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bg { fill: var(--bg); }
    .title { fill: var(--ink); font-size: 34px; font-weight: 700; }
    .subtitle { fill: var(--muted); font-size: 17px; }
    .section { fill: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .card-title { fill: var(--ink); font-size: 21px; font-weight: 700; }
    .card-copy { fill: var(--muted); font-size: 15px; }
    .pill-title { fill: var(--ink); font-size: 17px; font-weight: 700; }
    .pill-copy { fill: var(--muted); font-size: 13px; }
    .shell { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .arrow { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .loop { fill: none; stroke: var(--muted); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 9; marker-end: url(#arrow-muted); opacity: .8; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect class="bg" width="920" height="560" rx="24" />
  <text class="title" x="42" y="58">Documentation Operating System</text>
  <text class="subtitle" x="42" y="88">Turning product change into trusted docs, agent context, and user activation.</text>

  <rect class="shell" x="36" y="124" width="848" height="260" rx="24" />
  <text class="section" x="62" y="158">From engineering motion to documented knowledge</text>

  <g transform="translate(62 184)">
    <rect width="174" height="132" rx="18" fill="var(--blue-soft)" stroke="var(--blue)" stroke-opacity=".42" />
    <text class="card-title" x="22" y="42">Product</text>
    <text class="card-title" x="22" y="68">change</text>
    <text class="card-copy" x="22" y="98">PRs, APIs, UX</text>
    <text class="card-copy" x="22" y="118">and releases</text>
  </g>

  <path class="arrow" d="M252 250 L304 250" />

  <g transform="translate(320 184)" filter="url(#shadow)">
    <rect width="174" height="132" rx="18" fill="var(--violet-soft)" stroke="var(--violet)" stroke-opacity=".46" />
    <text class="card-title" x="22" y="42">Signal</text>
    <text class="card-title" x="22" y="68">detection</text>
    <text class="card-copy" x="22" y="98">Impact, priority</text>
    <text class="card-copy" x="22" y="118">and context</text>
  </g>

  <path class="arrow" d="M510 250 L562 250" />

  <g transform="translate(578 184)">
    <rect width="174" height="132" rx="18" fill="var(--green-soft)" stroke="var(--green)" stroke-opacity=".42" />
    <text class="card-title" x="22" y="42">Docs</text>
    <text class="card-title" x="22" y="68">operations</text>
    <text class="card-copy" x="22" y="98">Route, review</text>
    <text class="card-copy" x="22" y="118">and measure</text>
  </g>

  <path class="arrow" d="M752 250 C785 250 792 250 810 250" />

  <g transform="translate(770 184)">
    <rect width="88" height="132" rx="18" fill="var(--orange-soft)" stroke="var(--orange)" stroke-opacity=".42" />
    <text class="card-title" x="22" y="51">Docs</text>
    <text class="card-copy" x="22" y="82">ready</text>
    <text class="card-copy" x="22" y="104">to ship</text>
  </g>

  <rect class="shell" x="36" y="412" width="848" height="102" rx="24" />
  <text class="section" x="62" y="445">Activation layer</text>

  <g transform="translate(62 462)">
    <rect width="190" height="34" rx="17" fill="var(--rose-soft)" stroke="var(--rose)" stroke-opacity=".35" />
    <text class="pill-title" x="18" y="23">MCP-ready context</text>
  </g>

  <g transform="translate(276 462)">
    <rect width="176" height="34" rx="17" fill="var(--rose-soft)" stroke="var(--rose)" stroke-opacity=".28" />
    <text class="pill-title" x="18" y="23">Coding agents</text>
  </g>

  <g transform="translate(476 462)">
    <rect width="190" height="34" rx="17" fill="var(--rose-soft)" stroke="var(--rose)" stroke-opacity=".24" />
    <text class="pill-title" x="18" y="23">AEO / GEO</text>
  </g>

  <g transform="translate(690 462)">
    <rect width="168" height="34" rx="17" fill="var(--rose-soft)" stroke="var(--rose)" stroke-opacity=".22" />
    <text class="pill-title" x="18" y="23">User activation</text>
  </g>

  <path class="arrow" d="M814 316 C814 360 770 388 706 421" />
  <path class="loop" d="M705 514 C594 543 220 539 145 330" />
  <text class="pill-copy" x="326" y="534">Feedback loop: questions, gaps, usage signals, and release learning</text>
</svg>
